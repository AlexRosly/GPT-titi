openapi: 3.0.3
info:
  title: GPT-Titi API
  description: Backend API for Chat, Billing, Stripe and Admin panel
  version: 1.1.0

servers:
  - url: http://localhost:7000/gpt-titi/api
    description: Local
  - url: https://ypbooking.chost.com.ua/gpt-titi/api
    description: Production

tags:
  - name: Auth
  - name: User
  - name: Chat
  - name: Conversations
  - name: Billing
  - name: Stripe
  - name: Admin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    TokenTransferError:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          enum:
            - INVALID_EMAIL
            - INVALID_AMOUNT
            - INVALID_CLIENT_TRANSFER_ID
            - SELF_TRANSFER
            - SENDER_NOT_ALLOWED
            - RECIPIENT_NOT_FOUND
            - RECIPIENT_DELETED
            - RECIPIENT_UNAVAILABLE
            - INSUFFICIENT_BALANCE
            - IDEMPOTENCY_CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
        appTokens:
          type: number
          description: Current sender balance; included for INSUFFICIENT_BALANCE.

    TokenTransferRequest:
      type: object
      required: [email, amount, clientTransferId]
      properties:
        email:
          type: string
          format: email
          description: Recipient email; trimmed and lowercased before literal, case-insensitive lookup.
          example: alex@example.com
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Positive safe integer JSON number; strings and fractional values are rejected.
          example: 1000
        clientTransferId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv4 generated once per intended transfer. Reuse this ID and the same payload on a network retry.
          example: 2d119c58-f40c-4c75-b866-797118cc22ca

    TokenTransferResult:
      type: object
      required: [success, transfer, appTokens, alreadyApplied]
      properties:
        success:
          type: boolean
          enum: [true]
        transfer:
          type: object
          required: [id, clientTransferId, email, amount, createdAt]
          properties:
            id:
              type: string
              description: Transfer ledger ObjectId.
            clientTransferId:
              type: string
              format: uuid
            email:
              type: string
              format: email
              description: Normalized recipient email.
            amount:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            createdAt:
              type: string
              format: date-time
        appTokens:
          type: number
          description: Sender balance immediately after the original transfer. On a replay this is a historical receipt balance, not the current balance.
        alreadyApplied:
          type: boolean
          description: True when returning an existing transfer for this sender and clientTransferId without applying another debit or credit.

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        modelId:
          type: string
        createdAt:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        lastMessageAt:
          type: string

# ===========================
# 🔐 AUTH / USER
# ===========================
paths:
  /users/user:
    post:
      tags: [Auth]
      summary: Google Login / Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        200:
          description: Authorized

  /users/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: New access token

  /users/logout:
    get:
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      summary: Logout user
      responses:
        200:
          description: Logged out

  /users/usage/summary:
    get:
      tags: [User]
      security: [{ BearerAuth: [] }]
      summary: Usage summary
      responses:
        200:
          description: Summary

  /users/usage/history:
    get:
      tags: [User]
      security: [{ BearerAuth: [] }]
      summary: Usage history
      parameters:
        - name: days
          in: query
          schema:
            type: number
            default: 7
      responses:
        200:
          description: History

  /users/token-transfers/recipient:
    get:
      tags: [User]
      security: [{ BearerAuth: [] }]
      summary: Check whether a recipient can receive tokens
      description: >-
        Only active senders can transfer tokens. An active or blocked recipient is
        eligible; deleted recipients are rejected. This check does not reserve tokens
        or guarantee a later transfer: POST validates the status and balance again.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: Trimmed and lowercased; matched by literal, case-insensitive equality.
      responses:
        '200':
          description: Recipient can receive tokens
          content:
            application/json:
              schema:
                type: object
                required: [success, canTransfer, recipient, appTokens]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  canTransfer:
                    type: boolean
                    enum: [true]
                  recipient:
                    type: object
                    required: [email, status]
                    properties:
                      email:
                        type: string
                        format: email
                      status:
                        type: string
                        enum: [active, blocked]
                  appTokens:
                    type: number
                    description: Current sender balance.
        '400':
          description: INVALID_EMAIL or SELF_TRANSFER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: SENDER_NOT_ALLOWED (sender is not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '404':
          description: RECIPIENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '409':
          description: RECIPIENT_DELETED (message explains account deletion) or RECIPIENT_UNAVAILABLE (unsupported status or ambiguous email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'

  /users/token-transfers:
    post:
      tags: [User]
      security: [{ BearerAuth: [] }]
      summary: Transfer tokens to another user
      description: >-
        Atomically debits an active sender, credits an active or blocked recipient,
        and changes a blocked recipient to active. Deleted recipients cannot receive
        tokens. Status and sufficient balance are checked inside the transaction.
        Repeating the same sender, clientTransferId and normalized payload returns
        the original receipt with alreadyApplied=true. Reusing the ID with a changed
        recipient or amount returns IDEMPOTENCY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTransferRequest'
      responses:
        '200':
          description: Transfer committed, or existing receipt returned without transferring again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResult'
        '400':
          description: INVALID_EMAIL, INVALID_AMOUNT, INVALID_CLIENT_TRANSFER_ID or SELF_TRANSFER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: SENDER_NOT_ALLOWED (sender is not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '404':
          description: RECIPIENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '409':
          description: >-
            RECIPIENT_DELETED (message explains account deletion),
            RECIPIENT_UNAVAILABLE (unsupported status, ambiguous email or balance overflow),
            INSUFFICIENT_BALANCE (includes appTokens), or IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferError'

# ===========================
# 💬 CHAT
# ===========================
  /chat/preview:
    post:
      tags: [Chat]
      security: [{ BearerAuth: [] }]
      summary: Preview chat cost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [modelId, estimatedTokens]
              properties:
                modelId:
                  type: string
                estimatedTokens:
                  type: number
      responses:
        200:
          description: Preview OK
        402:
          description: Insufficient balance

  /chat/stream:
    post:
      tags: [Chat]
      security: [{ BearerAuth: [] }]
      summary: Stream chat response (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [conversationId, modelId, message]
              properties:
                conversationId:
                  type: string
                modelId:
                  type: string
                message:
                  type: string
      responses:
        200:
          description: SSE stream

# ===========================
# 💬 CONVERSATIONS
# ===========================
  /conversations:
    get:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Get conversations
      responses:
        200:
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

    post:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Create conversation
      requestBody:
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
      responses:
        201:
          description: Created

  /conversations/{id}/messages:
    get:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Get conversation messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

    delete:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Clear conversation messages
      parameters:
        - name: id
          in: path
          required: true

  /conversations/{id}/regenerate:
    post:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Regenerate last assistant answer

  /conversations/{id}/fork:
    post:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Fork conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [messageId]
              properties:
                messageId:
                  type: string

  /messages/{id}/edit-and-regenerate:
    post:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Edit user message and regenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [content]
              properties:
                content:
                  type: string

  /conversations/{id}:
    delete:
      tags: [Conversations]
      security: [{ BearerAuth: [] }]
      summary: Archive conversation

# ===========================
# 💳 BILLING
# ===========================
  /billing/prices:
    get:
      tags: [Billing]
      security: [{ BearerAuth: [] }]
      summary: Token packages

  /billing/checkout:
    post:
      tags: [Billing]
      security: [{ BearerAuth: [] }]
      summary: Stripe checkout

  /billing/payments:
    get:
      tags: [Billing]
      security: [{ BearerAuth: [] }]
      summary: User payments

# ===========================
# 🛠 ADMIN
# ===========================
  /admin/models:
    get:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Get models

  /admin/create-models:
    post:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Create model

  /admin/users:
    get:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Get users

  /admin/users/{id}/block:
    post:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Block user

  /admin/payments:
    get:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Payments

  /admin/analytics/models:
    get:
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      summary: Model analytics

  /admin/users/{id}/role:
    post:
      tags: [Admin]
      security:
        - BearerAuth: []
      summary: Change user role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, admin, moderator, support]
      responses:
        200:
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
        400:
          description: Invalid role
        403:
          description: Forbidden
        404:
          description: User not found

