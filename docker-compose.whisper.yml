services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    profiles: ["gpu"]
    init: true
    restart: unless-stopped
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper-cpu:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["cpu"]
    init: true
    restart: unless-stopped
    cpus: "${WHISPER_CPU_LIMIT:-1.0}"
    mem_limit: ${WHISPER_MEMORY_LIMIT:-2147483648}
    memswap_limit: ${WHISPER_MEMORY_LIMIT:-2147483648}
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "1"
      WHISPER__NUM_WORKERS: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8000}:8000"

volumes:
  whisper-models:
